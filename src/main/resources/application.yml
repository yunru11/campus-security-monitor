server:
  port: 8888
  forward-headers-strategy: native
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
spring:
  datasource:
    username: ${DB_USERNAME:monitor_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:monitor}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
ai:
  event:
    token: ${AI_EVENT_TOKEN}
    min-confidence: ${AI_MIN_CONFIDENCE:0.25}
monitor:
  auth:
    username: ${MONITOR_ADMIN_USERNAME:admin}
    password: ${MONITOR_ADMIN_PASSWORD}
